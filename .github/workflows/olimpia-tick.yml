# Aviso periódico a la función olimpia-tasks de Supabase (tareas automáticas de OlimpIA en la nube).
# Antes lo hacía pg_cron + pg_net dentro de la base de datos, pero le quitaba memoria a la instancia
# del plan Free. GitHub puede retrasar unos minutos las ejecuciones programadas; para las tareas
# diarias/semanales/mensuales no importa.
#
# Necesita el secreto OLIMPIA_CRON_SECRET del repositorio, con el valor de
# `select value from olimpia_settings where key = 'cron_secret';`
name: OlimpIA tick

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Avisar a olimpia-tasks
        run: |
          curl -fsS -X POST "https://vnockjqtkbhgytmmbdlb.supabase.co/functions/v1/olimpia-tasks" \
            -H "Content-Type: application/json" \
            -H "x-olimpia-secret: ${{ secrets.OLIMPIA_CRON_SECRET }}" \
            -d '{}' --max-time 30 --retry 2
